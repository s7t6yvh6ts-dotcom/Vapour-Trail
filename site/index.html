<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vapour Trail</title>
<meta name="description" content="Vintage clothing, one of each. Direct from us, no marketplace fees.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23a8442f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1 id="shopname">Vapour Trail</h1><button class="cartbtn" id="open">Basket (<span id="count">0</span>)</button></header>
<section class="hero"><h2 id="tagline"></h2><p>Small runs and one-off pieces. When your size is gone, it is gone.</p></section>
<nav class="filters" id="types"></nav>
<nav class="filters" id="filters"></nav>
<main class="grid" id="grid"></main>
<aside id="drawer" aria-label="Basket">
  <header><h1>Basket</h1><button class="cartbtn" id="close">Close</button></header>
  <div id="items"></div>
  <footer class="cart">
    <div class="total"><span>Subtotal</span><span id="sub">£0.00</span></div>
    <div class="note" id="ship"></div>
    <button class="checkout" id="checkout" disabled>Checkout</button>
    <div class="note" id="mode"></div>
  </footer>
</aside>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
